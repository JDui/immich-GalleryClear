version: "3.8"

services:
  immich-random-cleaner:
    image: immich-random-cleaner:0.7.25
    container_name: immich-random-cleaner
    restart: unless-stopped
    ports:
      - "8787:8000"
    environment:
      IMMICH_BASE_URL: "http://immich_server:2283"
      IMMICH_API_KEY: "请在这里填入你的 Immich API Key"
      DB_PATH: "/app/data/random_cleaner.db"
      ALLOW_DB_FALLBACK: "true"
    volumes:
      - "./data:/app/data"
